<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iris Classifier</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 20px; }
    h1 { margin-bottom: 4px; }
    .subtitle { color: #666; margin-top: 0; }
    .field { margin: 14px 0; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    .hint { color: #888; font-size: 13px; font-weight: 400; }
    input[type="number"] { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 12px 24px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .card { margin-top: 24px; padding: 18px; background: #f5f5f7; border-radius: 10px; }
    .prediction { font-size: 24px; font-weight: 700; margin: 0 0 6px; }
    .conf { color: #444; margin: 0 0 12px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin: 4px 0; font-size: 14px; }
    .bar-label { width: 90px; text-transform: capitalize; }
    .bar-track { flex: 1; height: 12px; background: #e0e0e4; border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; background: #4a7dff; transition: width 0.3s; }
    .error { color: #c00; }
    .loading { color: #666; }
  </style>
</head>
<body>
  <h1>Iris Species Classifier</h1>
  <p class="subtitle">Enter flower measurements and click Predict.</p>

  <div class="field">
    <label>Sepal length (cm) <span class="hint">– typical 4.3 to 7.9</span></label>
    <input id="sepal_length" type="number" step="0.1" value="5.1" />
  </div>
  <div class="field">
    <label>Sepal width (cm) <span class="hint">– typical 2.0 to 4.4</span></label>
    <input id="sepal_width" type="number" step="0.1" value="3.5" />
  </div>
  <div class="field">
    <label>Petal length (cm) <span class="hint">– typical 1.0 to 6.9</span></label>
    <input id="petal_length" type="number" step="0.1" value="1.4" />
  </div>
  <div class="field">
    <label>Petal width (cm) <span class="hint">– typical 0.1 to 2.5</span></label>
    <input id="petal_width" type="number" step="0.1" value="0.2" />
  </div>

  <button id="btn" onclick="predict()">Predict</button>

  <div id="result" class="card" style="display:none;"></div>

  <script>
    // Change this to your deployed backend URL when you host it
    const API_URL = "http://localhost:8000/predict";

    async function predict() {
      const btn = document.getElementById("btn");
      const box = document.getElementById("result");

      const payload = {
        sepal_length: parseFloat(document.getElementById("sepal_length").value),
        sepal_width:  parseFloat(document.getElementById("sepal_width").value),
        petal_length: parseFloat(document.getElementById("petal_length").value),
        petal_width:  parseFloat(document.getElementById("petal_width").value),
      };

      if (Object.values(payload).some(v => Number.isNaN(v))) {
        showError("Please fill in all four measurements.");
        return;
      }

      btn.disabled = true;
      box.style.display = "block";
      box.innerHTML = '<p class="loading">Predicting…</p>';

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        const data = await res.json();
        render(data);
      } catch (e) {
        showError(e.message);
      } finally {
        btn.disabled = false;
      }
    }

    function render(data) {
      const box = document.getElementById("result");
      const bars = Object.entries(data.probabilities).map(([name, p]) => `
        <div class="bar-row">
          <span class="bar-label">${name}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(p*100).toFixed(1)}%"></div></div>
          <span>${(p*100).toFixed(1)}%</span>
        </div>`).join("");

      box.innerHTML = `
        <p class="prediction">${data.prediction}</p>
        <p class="conf">Confidence: ${(data.confidence*100).toFixed(1)}%</p>
        ${bars}
      `;
    }

    function showError(msg) {
      const box = document.getElementById("result");
      box.style.display = "block";
      box.innerHTML = `<p class="error">Error: ${msg}</p>`;
    }
  </script>
</body>
</html>
